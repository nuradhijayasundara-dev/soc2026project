<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B2447" />
      <stop offset="55%" stop-color="#0E3060" />
      <stop offset="100%" stop-color="#123B74" />
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB800" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FFB800" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)" />

  <!-- soft glow near horizon -->
  <ellipse cx="1250" cy="560" rx="620" ry="260" fill="url(#glow)" />

  <!-- distant skyline -->
  <g fill="#0E2D5A" opacity="0.7">
    <rect x="60" y="520" width="40" height="160" />
    <rect x="115" y="480" width="30" height="200" />
    <rect x="160" y="545" width="50" height="135" />
    <rect x="225" y="500" width="35" height="180" />
    <rect x="1320" y="510" width="42" height="170" />
    <rect x="1380" y="470" width="30" height="210" />
    <rect x="1425" y="540" width="55" height="140" />
    <rect x="1495" y="495" width="34" height="185" />
  </g>

  <!-- ground -->
  <rect x="0" y="680" width="1600" height="220" fill="#081B36" />

  <!-- road -->
  <rect x="0" y="700" width="1600" height="110" fill="#0A2142" />
  <g stroke="#FFB800" stroke-width="6" stroke-dasharray="34 26" opacity="0.55">
    <line x1="0" y1="755" x2="1600" y2="755" />
  </g>

  <!-- dashed route arcing above the road, brand accent -->
  <path d="M40,660 C 420,560 520,560 760,610 S 1180,660 1560,560"
        fill="none" stroke="#FFB800" stroke-width="4" stroke-dasharray="2 16"
        stroke-linecap="round" opacity="0.55" />
  <circle cx="40" cy="660" r="7" fill="#FFB800" opacity="0.85" />
  <circle cx="1560" cy="560" r="7" fill="#FFB800" opacity="0.85" />

  <!-- fleet of trucks, simple flat silhouettes -->
  <g id="truck-a" transform="translate(180,650)">
    <rect x="0" y="30" width="120" height="46" rx="4" fill="#123B74" />
    <rect x="120" y="0" width="60" height="76" rx="4" fill="#164A8F" />
    <rect x="132" y="14" width="34" height="26" rx="2" fill="#7FB6FF" opacity="0.45" />
    <circle cx="38" cy="82" r="16" fill="#06132A" />
    <circle cx="38" cy="82" r="7" fill="#3E5F8A" />
    <circle cx="150" cy="82" r="16" fill="#06132A" />
    <circle cx="150" cy="82" r="7" fill="#3E5F8A" />
  </g>

  <g id="truck-b" transform="translate(430,662) scale(0.85)">
    <rect x="0" y="30" width="120" height="46" rx="4" fill="#0E2D5A" />
    <rect x="120" y="0" width="60" height="76" rx="4" fill="#123B74" />
    <rect x="132" y="14" width="34" height="26" rx="2" fill="#7FB6FF" opacity="0.4" />
    <circle cx="38" cy="82" r="16" fill="#06132A" />
    <circle cx="38" cy="82" r="7" fill="#3E5F8A" />
    <circle cx="150" cy="82" r="16" fill="#06132A" />
    <circle cx="150" cy="82" r="7" fill="#3E5F8A" />
  </g>

  <g id="truck-c" transform="translate(980,648)">
    <rect x="0" y="30" width="130" height="48" rx="4" fill="#164A8F" />
    <rect x="130" y="0" width="62" height="78" rx="4" fill="#1B58A8" />
    <rect x="142" y="14" width="36" height="26" rx="2" fill="#FFB800" opacity="0.5" />
    <circle cx="40" cy="84" r="17" fill="#06132A" />
    <circle cx="40" cy="84" r="7.5" fill="#3E5F8A" />
    <circle cx="158" cy="84" r="17" fill="#06132A" />
    <circle cx="158" cy="84" r="7.5" fill="#3E5F8A" />
  </g>

  <g id="truck-d" transform="translate(1250,662) scale(0.8)">
    <rect x="0" y="30" width="120" height="46" rx="4" fill="#0E2D5A" />
    <rect x="120" y="0" width="60" height="76" rx="4" fill="#123B74" />
    <rect x="132" y="14" width="34" height="26" rx="2" fill="#7FB6FF" opacity="0.4" />
    <circle cx="38" cy="82" r="16" fill="#06132A" />
    <circle cx="38" cy="82" r="7" fill="#3E5F8A" />
    <circle cx="150" cy="82" r="16" fill="#06132A" />
    <circle cx="150" cy="82" r="7" fill="#3E5F8A" />
  </g>

  <!-- scattered route pins -->
  <g fill="#FFB800" opacity="0.7">
    <circle cx="760" cy="608" r="5" />
    <circle cx="1180" cy="662" r="5" />
  </g>
</svg>
